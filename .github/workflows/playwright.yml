name: Playwright E2E
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "24.14.0"
  # Prisma + Mongo exige replica set (mesma topologia de dev e produção).
  DATABASE_URL: mongodb://localhost:27017/carteado_e2e?replicaSet=rs0&directConnection=true
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
  NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

jobs:
  e2e:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.0
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "rs.status().myState" | grep -q 1 && echo "Replica set ready" && exit 0
            sleep 2
          done
          echo "Replica set failed to start" && exit 1
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Build shared, backend and frontend
        run: npm run build
        env:
          API_URL: http://localhost:4000/api/v1
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-nextauth-secret-for-e2e
      - name: Setup database
        run: npm run prisma:db:push -w backend
      - name: Install Playwright browsers
        run: npm exec -w frontend -- playwright install --with-deps chromium
      - name: Start backend
        run: npm run start -w backend &
        env:
          NODE_ENV: test
          PORT: 4000
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: test-secret-for-e2e
          FRONTEND_URL: http://localhost:3000
      - name: Start frontend (production build)
        run: npm run start -w frontend &
        env:
          API_URL: http://localhost:4000/api/v1
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-nextauth-secret-for-e2e
      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/v1/health && curl -sf http://localhost:3000 > /dev/null && echo "App ready" && exit 0
            sleep 2
          done
          echo "App failed to start" && exit 1
      - name: Run Playwright tests
        run: npm run test:playwright -w frontend
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

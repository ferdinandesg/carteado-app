# Produção – frontend, backend, redis. Proxy (Traefik), TLS e MongoDB vêm da plataforma da VM
# (repo ferdinandesg/vm-infra); as rotas são as labels abaixo.
# Uso: cd deploy && docker compose -f docker-compose-prod.yml up -d
# CI cria .env no servidor a cada deploy. Execução manual: cd deploy && docker compose up -d (usa .env existente)

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ferdinandes/carteado-frontend:latest}
    container_name: carteado_frontend
    # Só loopback: o tráfego público entra pelo Traefik (rede edge).
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Server-side (NextAuth → backend via rede Docker)
      - API_URL=http://backend:4000/api/v1
      - NEXTAUTH_URL=https://carteado.ferdinandes.com.br
      # Client (browser) – base das chamadas API e socket
      - NEXT_PUBLIC_API_URL=https://carteado.ferdinandes.com.br/api/v1
      - NEXT_PUBLIC_SOCKET_URL=https://carteado.ferdinandes.com.br
      - GOOGLE_ID=${GOOGLE_ID}
      - GOOGLE_SECRET=${GOOGLE_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - APP_VERSION=${APP_VERSION:-latest}
      - AUTH_TRUST_HOST=true
    labels:
      - traefik.enable=true
      - traefik.http.routers.carteado.rule=Host(`carteado.ferdinandes.com.br`)
      - traefik.http.routers.carteado.entrypoints=websecure
      - traefik.http.routers.carteado.middlewares=ratelimit@file
      - traefik.http.services.carteado.loadbalancer.server.port=3000
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Rotação de logs: máximo de 10 megabytes por arquivo
        max-file: "3" # Rotação de logs: manter no máximo 3 arquivos de log
    networks:
      - app_network
      - edge

  backend:
    image: ${BACKEND_IMAGE:-ferdinandes/carteado-backend:latest}
    container_name: carteado_backend
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      # DATABASE_URL vem só do .env (CI: secrets.DATABASE_URL). Deve coincidir com o usuário real no MongoDB
      # (MONGO_INITDB_* só aplicam na primeira criação do volume; senão ajuste a senha no Mongo ou o secret).
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FRONTEND_URL=https://carteado.ferdinandes.com.br
    labels:
      - traefik.enable=true
      - traefik.http.routers.carteado-api.rule=Host(`carteado.ferdinandes.com.br`) && (PathPrefix(`/api/v1`) || PathPrefix(`/carteado_socket`))
      - traefik.http.routers.carteado-api.entrypoints=websecure
      - traefik.http.routers.carteado-api.middlewares=ratelimit@file
      - traefik.http.services.carteado-api.loadbalancer.server.port=4000
    healthcheck:
      # Liveness em /live (sem DB). Readiness real: curl/grep em /api/v1/health (ver deploy/diagnose-backend.sh)
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/live').then(r=>r.text().then(t=>{if(r.ok)process.exit(0);console.log('hc_fail',r.status,t.slice(0,240));process.exit(1)})).catch(e=>{console.log('hc_fail',e&&e.message?e.message:String(e));process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Rotação de logs: máximo de 10 megabytes por arquivo
        max-file: "3" # Rotação de logs: manter no máximo 3 arquivos de log
    networks:
      - app_network
      - edge

  redis:
    image: redis:7.0
    container_name: redis
    # Redis sem senha: nunca publicar fora do loopback.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_network
    command:
      ["redis-server", "--notify-keyspace-events", "Ex", "--appendonly", "yes"]

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge
  # Rede da plataforma da VM (vm-infra): Traefik e mongodb.
  edge:
    external: true
    name: edge
